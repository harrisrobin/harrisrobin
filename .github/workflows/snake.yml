# Redraws the snake that eats the contribution graph in README.md.
# The SVGs live on the `output` branch so main stays clean.
name: snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Dot colours copy the tokscale card's graph so both grids read as one set.
          outputs: |
            dist/github-snake.svg?color_snake=#1A7F37&color_dots=#EFF2F5,#79b8ff,#388bfd,#1f6feb,#0d419d
            dist/github-snake-dark.svg?color_snake=#3FB950&color_dots=#191F2B,#4069b2,#1f6feb,#388bfd,#79b8ff

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
